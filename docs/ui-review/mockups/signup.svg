<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{fill:#13212b}.D{font-family:Impact,'Arial Black',sans-serif}.m{fill:#5b6b72;font-size:12px}.w{fill:#fff}.k{fill:#0f6e6a}.B{font-weight:700}.f{fill:none;stroke:#b9c4c1}</style>
<rect width="390" height="800" fill="#eef4f2"/>
<rect width="390" height="52" fill="#0f6e6a"/><text class="D w" x="16" y="33" font-size="17">SPLIT FLIPPER ISLAND</text><circle cx="358" cy="26" r="8" fill="none" stroke="#fff" stroke-width="2"/>
<text class="D" x="16" y="92" font-size="26">SIGN UP YOUR TEAM</text>
<text class="m" font-size="13"><tspan x="16" y="116">Couples get first priority. You'll use your team name</tspan><tspan x="16" y="133">and PIN to log in on league nights.</tspan></text>
<rect class="f" x="16" y="150" width="358" height="52" rx="8"/><text class="m" x="30" y="168">Team name *</text><text x="30" y="190">Left &amp; Right</text>
<rect class="f" x="16" y="214" width="358" height="52" rx="8"/><text class="m" x="30" y="232">Player 1 phone *</text><text x="30" y="254">2025550142</text>
<rect class="f" x="16" y="278" width="358" height="52" rx="8"/><text class="m" x="30" y="296">Player 2 phone *</text><text x="30" y="318">2025550178</text>
<rect class="f" x="16" y="342" width="171" height="52" rx="8"/><text class="m" x="30" y="360">4-digit PIN *</text><text x="30" y="382">••••</text>
<rect class="f" x="203" y="342" width="171" height="52" rx="8"/><text class="m" x="217" y="360">PIN again *</text><text x="217" y="382">••••</text>
<rect x="16" y="414" width="358" height="72" rx="10" fill="none" stroke="#0f6e6a" stroke-width="2" stroke-dasharray="6 5"/>
<rect class="k" x="120" y="442" width="20" height="15" rx="3"/><circle cx="130" cy="450" r="4" fill="#eef4f2"/><text class="B k" x="150" y="455" font-size="15">Take a team photo</text>
<text class="m"><tspan x="16" y="506">Both of you in the shot. It shows next to your team name in</tspan><tspan x="16" y="522">the standings.</tspan><tspan x="16" y="548">Phone numbers stay private. They never appear in the</tspan><tspan x="16" y="564">standings or the league log.</tspan></text>
<rect x="16" y="584" width="358" height="52" rx="10" fill="#f5b700"/><text class="B" x="195" y="615" text-anchor="middle" font-size="15">Sign up</text>
<text x="195" y="672" text-anchor="middle">Already signed up? <tspan class="k" text-decoration="underline">Log in</tspan></text>
<rect y="744" width="390" height="56" fill="#fff"/><path d="M0 744h390" stroke="#d5dedb"/>
<g fill="#8a979c"><rect x="41" y="754" width="16" height="14" rx="3"/><rect x="138" y="754" width="16" height="14" rx="3"/><rect x="236" y="754" width="16" height="14" rx="3"/><rect x="333" y="754" width="16" height="14" rx="3"/></g>
<text class="m" text-anchor="middle"><tspan x="49" y="784">Home</tspan><tspan x="146" y="784">Submit</tspan><tspan x="244" y="784">Standings</tspan><tspan x="341" y="784">Log</tspan></text>
<rect x="1" y="1" width="388" height="798" fill="none" stroke="#13212b" stroke-width="2"/>
</svg>
