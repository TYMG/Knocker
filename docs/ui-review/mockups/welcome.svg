<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 640" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
