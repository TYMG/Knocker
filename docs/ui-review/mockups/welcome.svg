<text class="D k" font-size="40"><tspan x="16" y="106">SPLIT FLIPPER</tspan><tspan x="16" y="148">ISLAND</tspan></text>
<text font-size="16"><tspan x="16" y="186">Two players share one pinball machine.</tspan><tspan x="16" y="208">You take the left flipper, your partner takes</tspan><tspan x="16" y="230">the right, and you each get one hand. Eight</tspan><tspan x="16" y="252">weeks of league nights at Lyman's, then a</tspan><tspan x="16" y="274">championship.</tspan></text>
<rect x="16" y="296" width="358" height="76" rx="6" fill="#140b02"/><text class="s" x="358" y="348" text-anchor="end" font-size="40">24,680,135</text>
<rect x="16" y="400" width="358" height="52" rx="10" fill="#f5b700"/><text class="B" x="195" y="431" text-anchor="middle" font-size="15">Sign up your team</text>
<rect x="16" y="464" width="358" height="52" rx="10" fill="none" stroke="#0f6e6a"/><text class="B k" x="195" y="495" text-anchor="middle" font-size="15">Log in</text>
<text class="B k" x="195" y="550" text-anchor="middle" font-size="15">See the standings</text>
<rect y="584" width="390" height="56" fill="#fff"/><path d="M0 584h390" stroke="#d5dedb"/>
