<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>knckr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #13212b; --lagoon: #0f6e6a; --flipper: #f5b700; --paper: #eef4f2; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e7f0ee; --paper: #0c1a22; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
           font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; }
    main { padding: 2rem; max-width: 34rem; }
    h1 { font-family: 'Bungee', Impact, sans-serif; font-size: clamp(3rem, 14vw, 6rem); margin: 0; color: var(--lagoon); line-height: .9; }
    p { font-size: 1.15rem; line-height: 1.5; }
    a { color: inherit; font-weight: 700; text-decoration-color: var(--flipper); text-decoration-thickness: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>knckr</h1>
    <p>Pinball things from DC.</p>
    <p><a href="/split-flip-island">Split Flipper Island</a>, a couples split-flipper league.</p>
  </main>
</body>
</html>
